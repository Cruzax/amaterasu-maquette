<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amaterasu Maquette</title>
<style>
:root{
  --bg:#090608; --side:#07080b; --text:#f6f2f3; --muted:#b9b0b4; --dim:#8a8186;
  --red:#ed4a52; --red-2:#c8323d; --red-deep:#6c1925; --red-line:#a94850;
  --gold:#f2a541; --line:rgba(225,220,225,.16); --line-2:rgba(225,220,225,.22);
  --card:linear-gradient(145deg,#101115,#090a0e);
  --row:#15161b; --green:#3ad17a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}

/* Sidebar */
aside{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;gap:14px;align-items:center;padding:24px 20px;border-bottom:1px solid var(--line)}
.brand svg{filter:drop-shadow(0 0 10px rgba(237,74,82,.7))}
.brand b{display:block;letter-spacing:.18em;font-size:18px}
.brand small{display:block;letter-spacing:.22em;font-size:10px;color:var(--dim);margin-top:3px}
nav{padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
nav a{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:9px;font-weight:600;color:#e7e1e3;border:1px solid transparent}
nav a:hover{background:rgba(255,255,255,.04)}
nav a.active{background:linear-gradient(90deg,#741723,#48121b);border-color:rgba(232,57,70,.42);box-shadow:inset 3px 0 0 var(--red);color:#fff}
nav svg{width:20px;height:20px;flex:none}
.side-art{margin-top:auto;position:relative;height:230px;flex:none;pointer-events:none}
@media (max-height:760px){.side-art{height:120px}.side-art svg{display:none}}
.side-art .moon{position:absolute;left:-30px;bottom:-90px;width:270px;height:270px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#c8323d,#7d1520 60%,#3a0a10);box-shadow:0 0 80px rgba(200,50,61,.45)}
.side-art .moon::before,.side-art .moon::after{content:"";position:absolute;border-radius:50%;background:rgba(0,0,0,.14)}
.side-art .moon::before{width:46px;height:46px;left:70px;top:60px}
.side-art .moon::after{width:28px;height:28px;left:190px;top:40px}
.side-art svg{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);opacity:.95}

/* Main */
main{min-width:0}
.hero{position:relative;padding:34px 40px 46px;border-bottom:1px solid var(--line);overflow:hidden;
  background:linear-gradient(180deg,#120b0e,#0b0709)}
.hero .sun{position:absolute;right:420px;top:-110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#c8202c,#8c1520);opacity:.85}
.hero .torii{position:absolute;right:390px;top:28px;opacity:.9}
.hero .mount{position:absolute;inset:auto 0 0 0;height:60px;opacity:.5}
.eyebrow{color:var(--red);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;position:relative}
h1{font-size:44.8px;margin:12px 0 8px;position:relative}
.hero p{margin:0;color:#ddd5d8;position:relative}
.user{position:absolute;right:40px;top:32px;display:flex;align-items:center;gap:12px;padding:6px 8px 6px 6px;border:1px solid rgba(232,57,70,.4);border-radius:999px;background:rgba(10,8,10,.7);z-index:2}
.user b{display:block;font-size:14px}.user small{color:var(--muted);font-size:12px}
.btn-pill{background:var(--red-deep);border:1px solid var(--red-line);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;margin-left:28px}

.content{padding:24px 36px 48px;display:flex;flex-direction:column;gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:radial-gradient(circle at 100% 100%,rgba(94,14,29,.22),transparent 45%),var(--card);border:1px solid var(--line-2);border-radius:13px;padding:20px}
.card.hot{border-color:rgba(232,57,70,.5)}
.stat{display:flex;gap:14px;align-items:flex-start;position:relative;min-height:154px;padding-right:56px}
.stat .go{right:16px!important}
.ico{width:56px;height:56px;border-radius:10px;background:#3d0f17;display:grid;place-items:center;color:var(--red);flex:none}
.ico.gold{background:#3b2213;color:var(--gold)}
.ico svg{width:24px;height:24px}
.stat .lbl{font-size:14px;line-height:1.35}
.stat .val{font-size:32px;font-weight:700;margin:6px 0 10px}
.stat .val.gold{color:var(--gold)}
.stat .sub{font-size:13px;color:var(--muted)}
.stat .go{position:absolute;right:0;top:46px}
.go{width:32px;height:32px;border-radius:50%;border:1px solid var(--red);display:grid;place-items:center;color:var(--red);cursor:pointer}
.go svg{width:16px;height:16px}
.card-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.card-h h2{font-size:18.5px;margin:4px 0 6px}
.card-h p{margin:0;font-size:14px;color:#d4cbcf;line-height:1.45}
.card-h .link{margin-left:auto;color:var(--red);font-size:13px;white-space:nowrap;display:flex;gap:6px;align-items:center;cursor:pointer}
.card-h .ico{width:42px;height:42px}
.card-h .ico svg{width:19px;height:19px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--row);border:1px solid var(--line);border-radius:9px;padding:12px 16px;cursor:pointer}
.row:hover{border-color:rgba(232,57,70,.35)}
.row .rk{color:var(--gold);font-weight:700;width:14px}
.row .nm{font-weight:600}
.row .end{margin-left:auto;font-size:13px;color:#d4cbcf;display:flex;gap:16px;align-items:center}
.row .pts{margin-left:auto;font-weight:700;font-size:14px}
.row .arrow{color:var(--red)}
.date{background:#6c1925;border-radius:6px;width:56px;height:48px;display:grid;place-items:center;font-size:12.5px;font-weight:700;text-align:center;line-height:1.1;flex:none}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--red-2);flex:none;font-size:14px}
.av.lg{width:96px;height:96px;font-size:34px}
.small{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}

/* controls */
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:14px}
.tab{padding:10px 14px;border-radius:8px;background:#121318;border:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:linear-gradient(90deg,#741723,#48121b);border-color:rgba(232,57,70,.5);box-shadow:inset 3px 0 0 var(--red)}
.btn{background:linear-gradient(180deg,#d33a45,#a32430);border:1px solid #e0545c;border-radius:7px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(200,50,61,.25)}
.filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.filters label{display:flex;flex-direction:column;gap:6px;font-size:14px}
.field{background:#0c0d10;border:1px solid var(--line-2);border-radius:5px;padding:8px 10px;font-size:13px;min-width:120px}
.chk{flex-direction:row!important;align-items:center;padding-bottom:8px}
.ulink{color:var(--red);text-decoration:underline;font-size:14px;padding-bottom:9px;cursor:pointer}
.badge{width:28px;height:28px;border-radius:50%;background:#6c1925;border:1px solid var(--red-line);display:grid;place-items:center;font-size:12px;font-weight:700;margin-left:auto}

/* events */
.ev{display:grid;grid-template-columns:76px 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--row);margin-top:14px}
.ev .side{background:linear-gradient(180deg,#5f1520,#3c0d14);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;text-align:center;border-left:3px solid var(--red-2)}
.ev .side small{font-weight:400;font-size:12px;margin-top:4px;color:#e6dadd}
.ev .body{padding:18px 22px}
.ev h3{margin:0 0 6px;color:#ff9aa0;font-size:18px}
.ev .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chip{background:#3d0f17;border:1px solid #6c2530;border-radius:6px;padding:6px 9px;font-size:12px}
.chip b{display:block;font-size:12.5px}
.ev .foot{display:flex;gap:20px;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.bar{flex:1;height:26px;border-radius:999px;border:1px solid var(--red-line);background:#2a0b11;position:relative;overflow:hidden;display:grid;place-items:center;font-size:12px;font-weight:700}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7d1a26,#a92c38)}
.bar span{position:relative}
.cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:#2b1a10;color:var(--gold);margin-right:6px}

/* members */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.mcard{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:9px;background:var(--row);cursor:pointer}
.mcard:hover{border-color:rgba(232,57,70,.4)}
.mcard small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.prof{display:flex;gap:22px;align-items:center}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.char{border:1px solid var(--line);border-radius:9px;padding:14px;background:var(--row)}
.char b{display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kv div{background:var(--row);border:1px solid var(--line);border-radius:9px;padding:14px}
.kv b{display:block;font-size:24px;margin-top:6px}

/* fm */
.fmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fm{border:1px solid var(--line-2);border-radius:9px;padding:16px;background:var(--row)}
.fm.done{border:2px solid var(--green)}
.fm h4{margin:0 0 6px;color:#ffae73;font-size:15px}
.fm .meta{font-size:13px;color:#d4cbcf;font-weight:700}
.fm .k{margin-top:10px;font-weight:700}

/* solotage */
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dj{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:#0f1014;cursor:pointer}
.dj .img{height:150px;position:relative;display:grid;place-items:center}
.dj .img span{font-size:42px;opacity:.75}
.dj .txt{padding:12px 14px}
.dj b{display:block}
.dj .rec{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);border:1px solid var(--gold);color:var(--gold);font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px}

@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.mgrid{grid-template-columns:repeat(3,1fr)}.dgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr} aside{position:static;height:auto}.side-art{display:none}
  nav{flex-direction:row;overflow-x:auto} nav a{white-space:nowrap;padding:10px 12px}
  .grid2,.grid4,.fmgrid,.chars,.kv{grid-template-columns:1fr}.mgrid,.dgrid{grid-template-columns:1fr 1fr}
  .user{position:static;margin-bottom:18px;width:max-content}.hero{padding:24px 16px}.content{padding:16px}
  h1{font-size:34px}.hero .sun,.hero .torii{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <svg width="46" height="30" viewBox="0 0 46 30"><path fill="#ed4a52" d="M12 29a10 10 0 0 1-1.5-19.9A12 12 0 0 1 33 7.5 9 9 0 0 1 36 29Z"/></svg>
      <div><b>AMATERASU</b><small>GUILDE DOFUS</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-art">
      <div class="moon"></div>
      <svg width="130" height="190" viewBox="0 0 180 260"><path fill="#060608" d="M90 20c18 0 30 12 30 30 0 12-6 22-14 27 30 8 52 30 60 70l14 113H0l14-113c8-40 30-62 60-70-8-5-14-15-14-27 0-18 12-30 30-30Z"/><path fill="none" stroke="#c8323d" stroke-width="3" d="M62 160c0-10 10-14 16-10 2-8 14-10 18-2 6-6 18-2 18 8 8 0 10 12 0 14H64c-8 0-8-10-2-10Z"/></svg>
    </div>
  </aside>
  <main>
    <header class="hero">
      <div class="sun"></div>
      <svg class="torii" width="300" height="140" viewBox="0 0 300 140"><g fill="#0b0809"><path d="M0 20 Q150 0 300 20 L300 34 Q150 16 0 34Z"/><rect x="40" y="52" width="220" height="12"/><rect x="62" y="30" width="16" height="110"/><rect x="222" y="30" width="16" height="110"/><rect x="142" y="34" width="14" height="24"/></g></svg>
      <svg class="mount" viewBox="0 0 1200 60" preserveAspectRatio="none"><path fill="#1a0d10" d="M0 60 L120 20 L220 50 L380 10 L520 45 L640 15 L800 50 L950 5 L1080 40 L1200 18 L1200 60Z"/></svg>
      <div class="user" id="user"></div>
      <div class="eyebrow">Guilde Amaterasu</div>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<script>
/* ---------- Icônes ---------- */
const I={
  home:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h4M7 17h7"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0Z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
  wand:'<path d="m4 20 11-11M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1ZM19 11l.6 1.4L21 13l-1.4.6L19 15l-.6-1.4L17 13l1.4-.6Z"/>',
  cake:'<path d="M4 21V12h16v9M2 21h20M4 16c2 1.5 4 1.5 6 0s4-1.5 6 0 3 1.5 4 0M12 12V8M12 5.5v.01"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const ico=(n,s='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${s}>${I[n]}</svg>`;

/* ---------- Données fictives ---------- */
const PAL=['#7d1a26','#2d3a5e','#3b5e2d','#5e4a2d','#4a2d5e','#2d5e58','#5e2d45','#605a24'];
const members=[
  {id:'kaze',  name:'Kaze-Sram',   role:'Membre',     bday:false, msg:4,  voc:2},
  {id:'yoru',  name:'Yoru',        role:'Meneur',     bday:false, msg:28, voc:19},
  {id:'akane', name:'Akane-Iop',   role:'Bras droit', bday:true,  msg:14, voc:9},
  {id:'tsuki', name:'Tsukiyo',     role:'Officier',   bday:false, msg:11, voc:6},
  {id:'hoshi', name:'Hoshi-Eni',   role:'Membre',     bday:false, msg:6,  voc:5},
  {id:'ren',   name:'Ren-Cra',     role:'Membre',     bday:false, msg:7,  voc:2},
  {id:'mizu',  name:'Mizu-Feca',   role:'Officier',   bday:false, msg:3,  voc:4},
  {id:'kitsu', name:'Kitsune-Osa', role:'Membre',     bday:false, msg:5,  voc:1},
  {id:'shiro', name:'Shiro-Xelor', role:'Membre',     bday:false, msg:2,  voc:2},
  {id:'raiden',name:'Raiden',      role:'Membre',     bday:false, msg:1,  voc:2},
  {id:'sora',  name:'Sora-Elio',   role:'Membre',     bday:false, msg:2,  voc:0},
  {id:'kuro',  name:'Kuro-Enu',    role:'Membre',     bday:false, msg:1,  voc:0},
];
members.forEach((m,i)=>{m.color=PAL[i%PAL.length]; m.pts=m.msg+m.voc});
const me=members[0];
me.chars=[{n:'Kaze',c:'Sram',l:200},{n:'Kaze-Mule',c:'Enutrof',l:187},{n:'Petit-Kaze',c:'Eniripsa',l:142}];
me.jobs=[{n:'Bijoutier',l:200},{n:'Joaillomage',l:120},{n:'Paysan',l:60}];
const M=id=>members.find(m=>m.id===id);

const events=[
  {d:'31',m:'OCT.',h:'17:00',title:'Session solotage dj minotot',cat:'Donjon',date:'31 octobre 2026 à 17:00',desc:'On fait le donjon Minotot en solo en même temps et on publie nos scores sur l’appli.',org:'yoru',parts:['yoru','akane','ren'],max:12,wait:[]},
  {d:'02',m:'NOV.',h:'21:00',title:'Raid Comte Harebourg',cat:'Raid',date:'2 novembre 2026 à 21:00',desc:'Raid guilde, prévoir un perso 200 avec une bonne résistance eau.',org:'akane',parts:['akane','tsuki','mizu','hoshi','kaze','yoru','kitsu','shiro'],max:8,wait:['raiden','sora']},
  {d:'05',m:'NOV.',h:'20:30',title:'Soirée succès Dimensions',cat:'Succès',date:'5 novembre 2026 à 20:30',desc:'On enchaîne les succès des dimensions divines, tous niveaux bienvenus.',org:'tsuki',parts:['tsuki','ren'],max:6,wait:[]},
  {d:'09',m:'NOV.',h:'21:00',title:'Percepteurs & AvA',cat:'PvP',date:'9 novembre 2026 à 21:00',desc:'Défense des percepteurs et prise de zone en Alliance contre Alliance.',org:'yoru',parts:['yoru','raiden','kuro','sora'],max:16,wait:[]},
];

const fmOpen=[
  {t:'Cape Ombre Minotot — Vitalité',j:'Façomage',k:'1 200 000',by:'hoshi'},
  {t:'Bottes du Kralamoure — exo PM',j:'Cordomage',k:'8 500 000',by:'ren'},
];
const fmDone=[
  {t:'Anneau padgref EXO PA',j:'Joaillomage',k:'6 000 000',by:'yoru',to:'kaze'},
  {t:'Ceinture Ougah — Sagesse',j:'Costumage',k:'900 000',by:'mizu',to:'tsuki'},
  {t:'Dagues Erhy — Puissance',j:'Forgemage',k:'2 300 000',by:'kitsu',to:'akane'},
];

const dungeons=[
  ['Crypte de Kardorim',10,'💀'],['Château Ensablé',20,'🏰'],['Cour du Bouftou Royal',30,'🐑'],['Donjon des Tofus',40,'🐤'],
  ['Akadémie des Gobs',40,'🎓'],['Donjon des Larves',50,'🐛'],['Château du Wa Wabbit',60,'🐰'],['Antre du Dragon Cochon',100,'🐲'],
  ['Labyrinthe du Minotoror',120,'🐂'],['Ring du Capitaine Ekarlatte',130,'🥊'],['Salle du Minotot',160,'⚔️'],['Tombe du Shogun Tofugawa',160,'⛩️'],
  ['Antre du Kralamoure Géant',180,'🐙'],['Donjon du Comte Harebourg',200,'❄️'],['Tour de Solar',200,'☀️'],['Temple de Koutoulou',200,'🌀'],
];
const records={ 'Salle du Minotot':[['yoru',4,48],['akane',6,42],['ren',9,35]], 'Donjon des Tofus':[['kaze',3,20]], 'Château du Wa Wabbit':[['hoshi',5,30],['tsuki',7,26]], 'Tour de Solar':[['akane',12,60]] };

/* ---------- Helpers ---------- */
const av=(m,cls='')=>`<div class="av ${cls}" style="background:${m.color}">${m.name[0]}</div>`;
const go='<span class="go">'+ico('arrow')+'</span>';
const arrow='<span class="arrow">'+ico('arrow','width="16" height="16"')+'</span>';
const cardH=(icon,t,p,link,href)=>`<div class="card-h"><div class="ico">${ico(icon)}</div><div><h2>${t}</h2><p>${p}</p></div>${link?`<a class="link" href="${href}">${link} ${ico('arrow','width="14" height="14"')}</a>`:''}</div>`;
const sorted=(k)=>[...members].sort((a,b)=>b[k]-a[k]);
const rankOf=m=>sorted('pts').indexOf(m)+1;

/* ---------- Pages ---------- */
const pages={
  dashboard:{nav:'Tableau de bord',icon:'home',title:'Tableau de bord',sub:'Votre espace de guilde',render(){
    const top=sorted('pts').slice(0,5), bd=members.filter(m=>m.bday);
    return `
    <div class="grid4">
      <div class="card stat"><div class="ico">${ico('cal')}</div><div><div class="lbl">Prochains<br>événements</div><div class="val">${events.length}</div><div class="sub">à venir</div></div><a href="#evenements">${go}</a></div>
      <div class="card stat"><div class="ico gold">${ico('trophy')}</div><div><div class="lbl">Classement général</div><div class="val gold">${rankOf(me)}<sup style="font-size:16px">e</sup></div><div class="sub">${me.pts} points ce mois</div></div><a href="#classements">${go}</a></div>
      <div class="card stat"><div class="ico">${ico('users')}</div><div><div class="lbl">Membres de la<br>guilde</div><div class="val">${members.length}</div><div class="sub">dans l’annuaire</div></div><a href="#membres">${go}</a></div>
      <div class="card stat"><div class="ico">${ico('cake')}</div><div><div class="lbl">Anniversaires du jour</div><div class="val">${bd.length}</div><div class="sub">aujourd’hui</div></div></div>
    </div>
    <div class="grid2">
      <div class="card">${cardH('cal','Prochains événements','Les événements et les inscriptions de la guilde.','Voir tous les événements','#evenements')}
        <div class="rows">${events.slice(0,3).map(e=>`<a class="row" href="#evenements"><div class="date">${e.d} ${e.m}</div><div><div class="nm">${e.title}</div><div class="small">${e.date} · ${e.parts.length}/${e.max} places</div></div><span style="margin-left:auto">${arrow}</span></a>`).join('')}</div>
      </div>
      <div class="card hot">${cardH('trophy','Classement général mensuel','Points du mois en cours : messages admissibles et activité vocale mesurée.','Voir le classement','#classements')}
        <div class="rows">${top.map((m,i)=>`<div class="row"><span class="rk">${i+1}</span>${av(m)}<span>${m.name}</span><span class="pts">${m.pts} points</span></div>`).join('')}</div>
      </div>
    </div>
    <div class="grid2">
      <div class="card">${cardH('users','Membres de la guilde','L’annuaire des membres, profils et personnages.','Voir l’annuaire','#membres')}
        <p style="margin:-4px 0 12px;font-size:14px">${members.length} membres dans l’annuaire.</p>
        <div class="rows">${members.slice(0,5).map(m=>`<a class="row" href="#profil/${m.id}">${av(m)}<span class="nm">${m.name}</span><span class="end">${m.role==='Membre'?'Membre de la guilde':m.role} ${arrow}</span></a>`).join('')}</div>
      </div>
      <div class="card">${cardH('cake','Anniversaires du jour','Les membres qui fêtent leur anniversaire aujourd’hui.')}
        <div class="rows">${bd.length?bd.map(m=>`<a class="row" href="#profil/${m.id}">${av(m)}<span class="nm">${m.name}</span><span class="end">Joyeux anniversaire ! ${arrow}</span></a>`).join(''):'<p class="muted">Aucun anniversaire aujourd’hui.</p>'}</div>
      </div>
    </div>`;
  }},

  evenements:{nav:'Événements',icon:'cal',title:'Événements',sub:'Organisez-vous et inscrivez vos personnages aux activités de la guilde.',render(){
    return `
    <div class="card"><button class="btn">Créer un événement</button></div>
    <div class="tabs">${['Liste','Semaine','Mois'].map((t,i)=>`<span class="tab ${i?'':'on'}">${t}</span>`).join('')}</div>
    <div class="card filters">
      <label>Nom<input class="field" placeholder="Rechercher un événement"></label>
      <label>Catégorie<select class="field" style="min-width:0"><option>Toutes</option><option>Donjon</option><option>Succès</option><option>XP</option><option>Guilde</option><option>PvP</option><option>Raid</option><option>Autre</option></select></label>
      <label class="chk"><input type="checkbox"> Inscriptions disponibles</label>
      <button class="btn">Filtrer</button><a class="ulink">Réinitialiser</a>
    </div>
    <div class="card">
      <div style="display:flex"><div><h2 style="margin:0 0 6px;font-size:18.5px">Événements à venir</h2><div style="font-size:14px">Du plus proche au plus lointain.</div></div><span class="badge">${events.length}</span></div>
      ${events.map(e=>{const full=e.parts.length>=e.max, mine=e.parts.includes(me.id);return `
      <div class="ev"><div class="side">${e.d}<br>${e.m}<small>${e.h}</small></div><div class="body">
        <h3>${e.title}</h3><div class="small"><span class="cat">${e.cat}</span>${e.date} (Europe/Paris)</div>
        <p style="margin:12px 0 6px">${e.desc}</p>
        <div class="small">Organisé par <b style="color:#fff">${M(e.org).name}</b></div>
        <div style="font-weight:700;margin-top:14px">Participants (${e.parts.length}/${e.max})</div>
        <div class="chips">${e.parts.map(id=>`<span class="chip"><b>${M(id).name}</b>${M(id).name.toLowerCase()}</span>`).join('')}</div>
        <div style="font-weight:700">Liste d’attente (${e.wait.length})</div>
        <div class="chips">${e.wait.length?e.wait.map(id=>`<span class="chip"><b>${M(id).name}</b>en attente</span>`).join(''):'<span class="small">Personne en attente</span>'}</div>
        <div class="foot"><span class="small">${mine?'Vous êtes inscrit avec <b style="color:#fff">Kaze</b>.':full?'Complet — inscription en liste d’attente.':'Inscrivez un de vos personnages.'}</span>
          <div class="bar"><i style="width:${Math.min(100,e.parts.length/e.max*100)}%"></i><span>${e.parts.length}/${e.max} places</span></div>
          <button class="btn" style="padding:7px 14px">${mine?'Se désinscrire':full?'Liste d’attente':'S’inscrire'}</button></div>
      </div></div>`}).join('')}
    </div>`;
  }},

  classements:{nav:'Classements',icon:'trophy',title:'Classements',sub:'Messages admissibles et activité vocale mesurée sur Discord.',state:'pts',render(){
    const k=this.state, lbl={pts:'Général',voc:'Vocal',msg:'Messages'};
    return `
    <div class="card">
      <div class="card" style="padding:14px;display:flex;gap:8px">${Object.keys(lbl).map(x=>`<span class="tab ${x===k?'on':''}" data-rank="${x}">${lbl[x]}</span>`).join('')}</div>
      <div class="card filters" style="padding:14px;margin-top:12px"><label style="flex-direction:row;align-items:center;gap:10px">Période <select class="field"><option>octobre 2026 (en cours)</option><option>septembre 2026</option><option>août 2026</option></select></label><button class="btn">Afficher</button></div>
    </div>
    <div class="card"><h2 style="margin:0 0 16px;font-size:18.5px">${lbl[k]} · octobre 2026</h2>
      <div class="rows">${sorted(k).map((m,i)=>`<a class="row" href="#profil/${m.id}" ${m===me?'style="border-color:rgba(232,57,70,.6)"':''}><span class="rk" style="width:22px">${i+1}.</span>${av(m)}<span style="text-decoration:underline;color:#ffb48a">${m.name}</span>${m===me?'<span class="cat" style="margin-left:6px">Vous</span>':''}<span class="pts">${m[k]} points</span></a>`).join('')}</div>
    </div>`;
  }},

  membres:{nav:'Membres',icon:'users',title:'Membres',sub:'L’annuaire de la guilde, ses profils et ses personnages.',render(){
    return `
    <div class="tabs"><span class="tab on">Liste des membres</span><a class="tab" href="#profil/${me.id}">Ma page perso</a></div>
    <div class="card">
      <label style="display:flex;flex-direction:column;gap:8px;font-size:14px">Rechercher un membre<input class="field" id="msearch" placeholder="Nom du membre" style="max-width:250px"></label>
      <div class="mgrid" id="mgrid"></div>
    </div>`;
  },after(){
    const f=()=>{const q=(document.getElementById('msearch').value||'').toLowerCase();
      document.getElementById('mgrid').innerHTML=members.filter(m=>m.name.toLowerCase().includes(q)).map(m=>`<a class="mcard" href="#profil/${m.id}">${av(m)}<div><b>${m.name}</b><small>${m.role}</small></div></a>`).join('')};
    document.getElementById('msearch').oninput=f; f();
  }},

  profil:{nav:null,icon:'users',title:'Membres',sub:'L’annuaire de la guilde, ses profils et ses personnages.',navKey:'membres',render(id){
    const m=M(id)||me, isMe=m===me, chars=m.chars||[{n:m.name.split('-')[0],c:m.name.split('-')[1]||'Iop',l:200}], jobs=m.jobs||[];
    return `
    <div class="tabs"><a class="tab" href="#membres">Liste des membres</a><a class="tab ${isMe?'on':''}" href="#profil/${me.id}">Ma page perso</a></div>
    <div class="card prof">${av(m,'lg')}<div><h2 style="margin:0 0 8px">${m.name}</h2><div class="small">${m.role} · ID Discord : 2459931189844${String(37760+members.indexOf(m)).padStart(5,'0')}</div>${isMe?'<button class="btn" style="margin-top:12px">Ajouter un personnage</button>':''}</div></div>
    <div class="card"><h2 style="margin:0 0 6px;font-size:18.5px">Statistiques AMATERASU · mois en cours</h2><p class="small" style="margin:0 0 14px">Messages admissibles et activité vocale mesurée.</p>
      <div class="kv"><div>Rang général<b style="color:var(--gold)">${rankOf(m)}e</b></div><div>Messages<b>${m.msg} pts</b></div><div>Vocal<b>${m.voc} pts</b></div></div></div>
    <div class="card"><h2 style="margin:0 0 14px;font-size:18.5px">Personnages</h2><div class="chars">${chars.map(c=>`<div class="char"><b>${c.n}</b><span class="small">${c.c} · niveau ${c.l}</span></div>`).join('')}</div></div>
    <div class="card"><h2 style="margin:0 0 14px;font-size:18.5px">Métiers</h2>${jobs.length?`<div class="chars">${jobs.map(j=>`<div class="char"><b>${j.n}</b><span class="small">Niveau ${j.l}</span></div>`).join('')}</div>`:'<p class="muted" style="margin:0">Aucun métier renseigné.</p>'}</div>`;
  }},

  fm:{nav:'Forgemagie',icon:'wand',title:'Forgemagie',sub:'Consultez les demandes et proposez votre savoir-faire.',render(){
    return `
    <div style="display:flex;justify-content:flex-end"><button class="btn">Créer une demande</button></div>
    <div class="card filters" style="justify-content:space-between;padding:14px"><label>Métier<select class="field"><option>Tous les métiers</option><option>Joaillomage</option><option>Costumage</option><option>Cordomage</option><option>Sculptemage</option><option>Forgemage</option><option>Façomage</option></select></label><span style="font-size:14px;padding-bottom:9px">${fmOpen.length+fmDone.length} demandes</span></div>
    <div class="card"><h2 style="margin:0 0 14px;font-size:18.5px">Demandes en cours</h2><div class="fmgrid">${fmOpen.map(f=>`<div class="fm"><h4>${f.t}</h4><div class="meta">${f.j} · En attente d’un forgemage</div><div class="k">${f.k} kamas</div><div class="small" style="margin-top:6px">Demandé par ${M(f.by).name}</div><button class="btn" style="margin-top:12px;padding:7px 12px;font-size:13px">Proposer mes services</button></div>`).join('')}</div></div>
    <div class="card"><h2 style="margin:0 0 14px;font-size:18.5px">Historique des demandes terminées</h2><div class="fmgrid">${fmDone.map(f=>`<div class="fm done"><h4>${f.t}</h4><div class="meta">${f.j} · Aboutie</div><div class="k">${f.k} kamas</div><div class="small" style="margin-top:6px">${M(f.by).name} → ${M(f.to).name}</div></div>`).join('')}</div></div>`;
  }},

  solotage:{nav:'Défis Solotage',icon:'trophy',title:'Défis Solotage',sub:'Catalogue des donjons et performances en solitaire.',render(){
    const all=Object.entries(records).flatMap(([d,r])=>r.map(([id,tours,pts])=>({d,m:M(id),tours,pts}))).sort((a,b)=>b.pts-a.pts).slice(0,10);
    return `
    <div class="card"><h2 style="margin:0 0 6px;font-size:18.5px">Top 10 général</h2><p class="small" style="margin:0 0 14px">Les égalités de points partagent le même rang.</p>
      <div class="rows">${all.map((r,i)=>`<div class="row"><span class="rk" style="width:22px">${i+1}.</span>${av(r.m)}<div><div class="nm">${r.m.name}</div><div class="small">${r.d} · ${r.tours} tours</div></div><span class="pts">${r.pts} points</span></div>`).join('')}</div></div>
    <div class="card"><h2 style="margin:0 0 6px;font-size:18.5px">Catalogue des donjons</h2><p class="small" style="margin:0">Choisissez un donjon pour enregistrer un solotage.</p></div>
    <div class="card filters" style="padding:14px">
      <label>Nom<input class="field" style="min-width:180px"></label>
      <label>Niveau<select class="field"><option>Tous</option><option>1-50</option><option>51-100</option><option>101-150</option><option>151-200</option></select></label>
      <label>Records<select class="field"><option>Tous</option><option>Avec records</option><option>Sans record</option></select></label>
      <label>Tri<select class="field"><option>Niveau croissant</option><option>Nom</option><option>Participants</option></select></label>
    </div>
    <div class="dgrid">${dungeons.map(([n,l,e],i)=>{const r=records[n]||[];return `<div class="dj"><div class="img" style="background:linear-gradient(160deg,${PAL[i%PAL.length]},#0d0e12)"><span>${e}</span>${r.length?`<span class="rec">🏆 ${M(r[0][0]).name}</span>`:''}</div><div class="txt"><b>${n}</b><span class="small">Niveau ${l} · ${r.length} record${r.length>1?'s':''}</span></div></div>`}).join('')}</div>`;
  }},
};

/* ---------- Routeur ---------- */
document.getElementById('user').innerHTML=`${av(me)}<div><b>${me.name}</b><small>${me.role}</small></div><button class="btn-pill">Se déconnecter</button>`;
function route(){
  const [key,arg]=(location.hash.slice(1)||'dashboard').split('/');
  const p=pages[key]||pages.dashboard, active=p.navKey||key;
  document.getElementById('nav').innerHTML=Object.entries(pages).filter(([,v])=>v.nav).map(([k,v])=>`<a href="#${k}" class="${k===active?'active':''}">${ico(v.icon)}${v.nav}</a>`).join('');
  document.getElementById('title').textContent=p.title;
  document.getElementById('subtitle').textContent=p.sub;
  document.getElementById('view').innerHTML=p.render(arg);
  p.after&&p.after();
  document.querySelectorAll('[data-rank]').forEach(t=>t.onclick=()=>{pages.classements.state=t.dataset.rank;route()});
  window.scrollTo(0,0);
}
addEventListener('hashchange',route); route();
</script>
</body>
</html>
