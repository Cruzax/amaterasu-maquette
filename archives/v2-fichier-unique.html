<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amaterasu v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sumi:#050304;        /* fond */
  --ink:#0e0a0b;         /* surfaces */
  --ink-2:#161012;       /* surfaces relevées */
  --laque:#b3121f;       /* rouge laque */
  --laque-hi:#e0303c;    /* rouge vif / focus */
  --ember:#ff5a4f;       /* accents lumineux */
  --kin:#d9a441;         /* or, rangs */
  --washi:#efe6e1;       /* texte */
  --ash:#9a8f92;         /* texte secondaire */
  --hair:rgba(239,230,225,.09);
  --hair-2:rgba(239,230,225,.16);
  --serif:"Shippori Mincho B1",Georgia,serif;
  --sans:"Zen Kaku Gothic New",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sumi);color:var(--washi);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--laque-hi);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:84px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;border-right:1px solid var(--hair);background:var(--sumi);z-index:5}
.seal{width:46px;height:46px;border-radius:12px;background:var(--laque);display:grid;place-items:center;margin-bottom:22px;box-shadow:0 0 0 1px #ff6b6b33,0 8px 30px #b3121f55}
.seal svg{width:26px}
.rail a{width:60px;padding:10px 0 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ash);font-size:11px;font-weight:500;position:relative}
.rail a svg{width:22px;height:22px}
.rail a:hover{color:var(--washi);background:var(--ink-2)}
.rail a.on{color:var(--washi);background:linear-gradient(180deg,#2a0a0e,#170709)}
.rail a.on::before{content:"";position:absolute;left:-12px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--laque-hi);box-shadow:0 0 12px var(--laque-hi)}
.rail .spacer{flex:1}

.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:16px;padding:18px 40px;background:linear-gradient(180deg,var(--sumi) 70%,transparent)}
.top h1{font-family:var(--serif);font-weight:800;font-size:30px;margin:0;letter-spacing:.01em}
.top .guild{color:var(--ash);font-size:13px;margin-left:4px;padding-top:8px}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;width:300px;padding:9px 12px;border-radius:10px;background:var(--ink);border:1px solid var(--hair);color:var(--ash);font-size:13.5px}
.search kbd{margin-left:auto;font-family:var(--sans);font-size:11px;border:1px solid var(--hair-2);border-radius:5px;padding:1px 6px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--hair);background:var(--ink);display:grid;place-items:center;position:relative;color:var(--washi)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--ember)}
.me{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--hair);background:var(--ink)}
.me b{font-size:13.5px;display:block;line-height:1.1}.me small{color:var(--ash);font-size:11.5px}

.page{padding:6px 40px 60px;max-width:1440px}

/* ---------- Éléments communs ---------- */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff;box-shadow:inset 0 0 0 2px #ffffff1a}
.av.sm{width:28px;height:28px;font-size:12px}
.av.lg{width:84px;height:84px;font-size:32px;font-family:var(--serif)}
.panel{background:var(--ink);border:1px solid var(--hair);border-radius:18px;padding:22px}
.panel h2{font-family:var(--serif);font-weight:800;font-size:20px;margin:0}
.ph{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.ph a.more{margin-left:auto;color:var(--ember);font-size:13px}
.ph a.more:hover{text-decoration:underline}
.ash{color:var(--ash)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;background:var(--laque);color:#fff;box-shadow:0 6px 24px #b3121f44}
.btn:hover{background:var(--laque-hi)}
.btn.ghost{background:transparent;border:1px solid var(--hair-2);box-shadow:none}
.btn.ghost:hover{border-color:var(--laque-hi)}
.btn.sm{padding:7px 12px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--hair-2);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ash)}
.chip:hover{color:var(--washi)}
.chip.on{background:var(--washi);color:var(--sumi);border-color:var(--washi);font-weight:700}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--ink);border:1px solid var(--hair)}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;color:var(--ash);font-weight:700;font-size:13.5px}
.seg button.on{background:var(--laque);color:#fff}
.input{background:var(--ink);border:1px solid var(--hair);border-radius:10px;padding:9px 12px;min-width:240px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:#2a0a0e;color:#ff9f97}
.tag.kin{background:#2b2010;color:var(--kin)}
.tag.ok{background:#0f2418;color:#6fdc9a}

/* ---------- Accueil ---------- */
.bento{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-areas:"sun todo todo" "sun rank feed" "atelier defis feed";gap:18px}
.sun-card{grid-area:sun;position:relative;overflow:hidden;border-radius:22px;padding:28px;min-height:520px;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 0%,#2a070c 0%,#0e0708 60%);border:1px solid #ff5a4f22}
.waves{position:absolute;inset:auto 0 0 0;height:160px;opacity:.18}
.sun{position:relative;width:min(340px,80%);aspect-ratio:1;margin:8px auto 0}
.sun .disc{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e3333f,#9c0f1a 62%,#5a060d);box-shadow:0 0 90px #b3121f88,inset 0 -20px 40px #00000055;display:grid;place-items:center;text-align:center}
.sun svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.sun .t{font-family:var(--serif);font-weight:800;font-size:54px;line-height:1;letter-spacing:-.01em}
.sun .u{font-size:13px;opacity:.85;margin-top:6px}
.sun-card .next{position:relative;margin-top:auto;text-align:center}
.sun-card .next .k{color:#ffb3ac;font-size:13px}
.sun-card .next h3{font-family:var(--serif);font-size:26px;margin:4px 0 6px}
.sun-card .next p{margin:0 0 16px;color:#e5d4d1;font-size:14px}
.stack{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:18px}
.stack .avs{display:flex}.stack .avs .av{margin-left:-8px;box-shadow:0 0 0 2px #1a0709}
.todo{grid-area:todo}
.todo ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.todo li{border:1px solid var(--hair);border-radius:14px;padding:16px;background:var(--ink-2);display:flex;flex-direction:column;gap:10px}
.todo li.urgent{border-color:#e0303c66;background:linear-gradient(160deg,#25090d,var(--ink-2))}
.todo li b{font-size:15px}
.todo li span{color:var(--ash);font-size:13px;flex:1}
.rank{grid-area:rank}
.rank .big{display:flex;align-items:flex-end;gap:10px;margin:2px 0 14px}
.rank .big b{font-family:var(--serif);font-size:64px;line-height:.9;color:var(--kin)}
.rank .big span{color:var(--ash);font-size:13px;padding-bottom:6px}
.meter{height:8px;border-radius:99px;background:#241a1c;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--laque),var(--ember))}
.podium-mini{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.podium-mini div{display:flex;align-items:center;gap:10px;font-size:14px}
.podium-mini em{font-style:normal;width:16px;color:var(--kin);font-family:var(--serif);font-weight:800}
.podium-mini b{margin-left:auto;font-weight:500;color:var(--ash);font-size:13px}
.feed{grid-area:feed}
.feed ol{list-style:none;margin:0;padding:0;position:relative}
.feed ol::before{content:"";position:absolute;left:17px;top:6px;bottom:6px;width:1px;background:var(--hair-2)}
.feed li{display:flex;gap:12px;padding:9px 0;position:relative;font-size:14px}
.feed li .av{z-index:1}
.feed li small{display:block;color:var(--ash);font-size:12px}
.atelier-mini{grid-area:atelier}
.defis-mini{grid-area:defis}
.mini-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:14px}
.mini-row:first-of-type{border-top:0}
.mini-row .r{margin-left:auto;text-align:right;font-size:13px;color:var(--ash)}
.mini-row .r b{display:block;color:var(--washi);font-size:14px}
.bday{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:12px 16px;border-radius:14px;border:1px dashed #d9a44166;background:#1a1408;font-size:14px}
.bday b{color:var(--kin)}
.bday .btn{margin-left:auto}

/* ---------- Agenda ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:22px}
.day{border:1px solid var(--hair);border-radius:14px;padding:12px;background:var(--ink);min-height:96px;text-align:left}
.day.today{border-color:var(--laque-hi);box-shadow:inset 0 0 0 1px var(--laque-hi)}
.day .dn{color:var(--ash);font-size:12px}
.day .dd{font-family:var(--serif);font-size:26px;font-weight:800;line-height:1.1}
.day .ev-dot{margin-top:6px;font-size:11.5px;padding:3px 7px;border-radius:6px;background:#2a0a0e;color:#ffb3ac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.ticket{display:grid;grid-template-columns:110px 1fr 220px;border:1px solid var(--hair);border-radius:18px;background:var(--ink);overflow:hidden;margin-bottom:14px}
.ticket .when{background:linear-gradient(180deg,#3a0910,#1c0609);display:flex;flex-direction:column;justify-content:center;align-items:center;border-right:2px dashed #050304}
.ticket .when b{font-family:var(--serif);font-size:38px;line-height:1}
.ticket .when span{font-size:13px;color:#ffb3ac}
.ticket .what{padding:18px 22px}
.ticket h3{font-family:var(--serif);font-size:21px;margin:6px 0 4px}
.ticket p{margin:0;color:#d8cbc8;font-size:14px}
.ticket .who{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--ash)}
.ticket .who .avs{display:flex}.ticket .who .avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--ink)}
.ticket .act{padding:18px;border-left:1px solid var(--hair);display:flex;flex-direction:column;justify-content:center;gap:10px}
.places{font-size:13px;color:var(--ash)}
.places b{color:var(--washi);font-size:15px}

/* ---------- Guilde ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:16px;margin-bottom:22px}
.step{border:1px solid var(--hair);border-radius:18px 18px 6px 6px;background:var(--ink);text-align:center;padding:22px 16px 18px;cursor:pointer}
.step:hover{border-color:var(--hair-2)}
.step .pos{font-family:var(--serif);font-weight:800;font-size:40px;line-height:1;color:var(--ash)}
.step.p1{padding-top:34px;background:linear-gradient(180deg,#2b1f0c,var(--ink) 70%);border-color:#d9a44155}
.step.p1 .pos{color:var(--kin);font-size:54px}
.step .av{margin:12px auto 8px}
.step b{display:block;font-size:16px}
.step span{color:var(--ash);font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--ash);font-weight:500;font-size:12.5px;padding:0 12px 10px}
.tbl td{padding:10px 12px;border-top:1px solid var(--hair)}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--ink-2)}
.tbl tr.mine td{background:#1d080b}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .who{display:flex;align-items:center;gap:10px}
.tbl .rk{font-family:var(--serif);font-weight:800;width:40px;color:var(--ash)}
.mbar{width:120px;height:6px;border-radius:9px;background:#241a1c;overflow:hidden;display:inline-block;vertical-align:middle}
.mbar i{display:block;height:100%;background:var(--laque-hi)}

/* ---------- Défis ---------- */
.defis{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.defis .side{position:sticky;top:90px}
.top10 li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);font-size:14px}
.top10 li:first-child{border-top:0}
.top10 em{font-style:normal;font-family:var(--serif);font-weight:800;width:22px;color:var(--ash)}
.top10 li:nth-child(-n+3) em{color:var(--kin)}
.top10 small{display:block;color:var(--ash);font-size:12px}
.top10 b{margin-left:auto;font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--hair);background:var(--ink);text-align:left;padding:0;cursor:pointer}
.tile:hover{border-color:var(--laque-hi)}
.tile .art{height:120px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:12px}
.tile .art .lv{font-family:var(--serif);font-weight:800;font-size:40px;line-height:.9;color:#fff;text-shadow:0 2px 20px #0008}
.tile .art .lv small{display:block;font-family:var(--sans);font-size:11px;font-weight:500;opacity:.8}
.tile .art .em{font-size:34px}
.tile .nm{padding:10px 12px 12px;font-weight:700;font-size:14px}
.tile .nm small{display:block;font-weight:400;color:var(--ash);font-size:12px}
.tile .crown{position:absolute;top:10px;left:10px}

/* ---------- Atelier ---------- */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{background:var(--ink);border:1px solid var(--hair);border-radius:18px;padding:14px}
.col h3{font-family:var(--serif);font-size:18px;margin:4px 6px 12px;display:flex;align-items:center;gap:8px}
.col h3 span{font-family:var(--sans);font-size:12px;color:var(--ash);font-weight:500}
.job{border:1px solid var(--hair);border-radius:14px;padding:14px;background:var(--ink-2);margin-bottom:10px}
.job b{display:block;font-size:15px;margin:6px 0 4px}
.job .k{font-family:var(--serif);font-weight:800;font-size:20px;color:var(--kin)}
.job .k small{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ash)}
.job .who{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ash)}
.job .who .btn{margin-left:auto}

/* ---------- Drawer / palette / toast ---------- */
.scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,100%);background:var(--ink);border-left:1px solid var(--hair-2);z-index:21;transform:translateX(100%);transition:transform .25s ease;overflow:auto;padding:26px}
.drawer.on{transform:none}
.drawer .x{position:absolute;top:18px;right:18px}
.drawer h2{font-family:var(--serif);font-size:26px;margin:14px 0 2px}
.drawer h4{font-family:var(--serif);font-size:16px;margin:24px 0 10px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats3 div{border:1px solid var(--hair);border-radius:12px;padding:12px;font-size:12.5px;color:var(--ash)}
.stats3 b{display:block;font-family:var(--serif);font-size:24px;color:var(--washi)}
.list-plain{display:flex;flex-direction:column;gap:8px}
.list-plain div{display:flex;justify-content:space-between;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;font-size:14px}
.list-plain span{color:var(--ash)}
.palette{position:fixed;left:50%;top:14vh;transform:translateX(-50%) scale(.98);width:min(560px,92vw);background:var(--ink);border:1px solid var(--hair-2);border-radius:16px;z-index:22;opacity:0;pointer-events:none;transition:.15s;box-shadow:0 30px 80px #000}
.palette.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:16px 18px;font-size:16px;outline:none}
.palette ul{list-style:none;margin:0;padding:8px;max-height:50vh;overflow:auto}
.palette li a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px}
.palette li a:hover,.palette li a.sel{background:var(--ink-2)}
.palette li small{margin-left:auto;color:var(--ash)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--washi);color:var(--sumi);padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.2s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .bento{grid-template-columns:1fr 1fr;grid-template-areas:"sun todo" "sun rank" "feed feed" "atelier defis"}
  .todo ul{grid-template-columns:1fr}
  .ticket{grid-template-columns:90px 1fr}.ticket .act{grid-column:1/-1;border-left:0;border-top:1px solid var(--hair);flex-direction:row;align-items:center;justify-content:space-between}
  .defis{grid-template-columns:1fr}.defis .side{position:static}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--hair);background:#050304f2;backdrop-filter:blur(10px)}
  .rail .seal,.rail .spacer{display:none}
  .rail a{width:auto;flex:1}
  .rail a.on::before{left:30%;right:30%;top:-7px;bottom:auto;width:auto;height:3px}
  .top{padding:14px 16px}.top h1{font-size:24px}.top .guild,.search span,.search kbd,.me div{display:none}
  .search{width:auto;margin-left:auto}
  .page{padding:4px 16px 100px}
  .bento{grid-template-columns:1fr;grid-template-areas:"sun" "todo" "rank" "feed" "atelier" "defis"}
  .sun-card{min-height:auto}
  .week{grid-template-columns:repeat(7,64px);overflow-x:auto}
  .kanban{grid-template-columns:1fr}
  .podium{gap:8px}.step{padding:14px 6px}.step .pos{font-size:28px}.step.p1 .pos{font-size:36px}
  .tbl .hide-m{display:none}
  .input{min-width:0;width:100%}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Navigation principale"></nav>
  <div>
    <header class="top">
      <h1 id="ptitle"></h1><span class="guild">Amaterasu, guilde Dofus</span>
      <button class="search" id="openPal" aria-label="Rechercher"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Chercher un membre, un donjon…</span><kbd>Ctrl K</kbd></button>
      <button class="iconbtn" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg><span class="dot"></span></button>
      <button class="me" id="meBtn"></button>
    </header>
    <main class="page" id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="palette" id="pal"><input id="palIn" placeholder="Aller à…" aria-label="Rechercher"><ul id="palList"></ul></div>
<div class="toast" id="toast"></div>

<script>
/* ================= Données fictives ================= */
const PAL=['#8f1420','#2c3d6b','#2f5a35','#6b4a1f','#4c2a6b','#1f5c5a','#6b2448','#5a5520'];
const CLASSES=['Sram','Iop','Eniripsa','Cra','Feca','Osamodas','Xélor','Pandawa','Eliotrope','Enutrof','Sadida','Zobal'];
const members=[

const DAYS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtDay=d=>`${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const hhmm=d=>d.toTimeString().slice(0,5).replace(':','h');
const sortBy=k=>[...members].sort((a,b)=>b[k]-a[k]);
const rankOf=(m,k='pts')=>sortBy(k).indexOf(m)+1;
const esc=s=>s.replace(/'/g,"\\'");
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)};

/* ================= Actions ================= */
function toggleSignup(id){
  const e=events.find(x=>x.id===id);
  if(e.parts.includes(me.id)){e.parts=e.parts.filter(x=>x!==me.id);toast(`Désinscrit de ${e.title}`)}
  else if(e.wait.includes(me.id)){e.wait=e.wait.filter(x=>x!==me.id);toast(`Retiré de la liste d’attente`)}
  else if(e.parts.length>=e.max){e.wait.push(me.id);toast(`Ajouté à la liste d’attente de ${e.title}`)}
  else{e.parts.push(me.id);toast(`Inscrit à ${e.title} avec Kaze`)}
  render();
}
function takeJob(i){jobs[i].st='taken';jobs[i].to=me.id;toast(`Tu as pris en charge : ${jobs[i].t}`);render()}
function signupLabel(e){return e.parts.includes(me.id)?'Me désinscrire':e.wait.includes(me.id)?'Quitter l’attente':e.parts.length>=e.max?'Liste d’attente':'M’inscrire'}

  const recs=Object.entries(records).flatMap(([d,r])=>r.filter(x=>x[0]===id).map(x=>({d,t:x[1],p:x[2]})));
  openDrawer(`${av(m,'lg')}<h2>${m.name}</h2><div class="ash">${m.role}, ${m.cls} niveau ${m.lvl}</div>
    ${m===me?'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn sm">Ajouter un personnage</button><button class="btn ghost sm">Modifier mes métiers</button></div>':''}
    <h4>Octobre</h4><div class="stats3"><div>Rang<b style="color:var(--kin)">${rankOf(m)}e</b></div><div>Messages<b>${m.msg}</b></div><div>Vocal<b>${m.voc}</b></div></div>
    <h4>Personnages</h4><div class="list-plain">${chars.map(c=>`<div>${c.n}<span>${c.c}, niv. ${c.l}</span></div>`).join('')}</div>
    <h4>Métiers</h4>${jb.length?`<div class="list-plain">${jb.map(j=>`<div>${j.n}<span>niv. ${j.l}</span></div>`).join('')}</div>`:'<p class="ash">Aucun métier renseigné.</p>'}
    <h4>Records solotage</h4>${recs.length?`<div class="list-plain">${recs.map(r=>`<div>${r.d}<span>${r.p} pts, ${r.t} tours</span></div>`).join('')}</div>`:'<p class="ash">Aucun record pour l’instant.</p>'}`);
}
function openDungeon(n){
  const d=dungeons.find(x=>x[0]===n), r=records[n]||[];
  openDrawer(`<div style="font-size:56px">${d[2]}</div><h2>${n}</h2><div class="ash">Niveau ${d[1]}</div>
    <h4>Records</h4>${r.length?`<div class="list-plain">${r.map(([id,t,p],i)=>`<div>${i+1}. ${M(id).name}<span>${p} pts, ${t} tours</span></div>`).join('')}</div>`:'<p class="ash">Personne n’a encore soloté ce donjon.</p>'}
    <button class="btn" style="margin-top:20px;width:100%" onclick="closeAll();toast('Formulaire de record (à maquetter)')">Enregistrer mon solotage</button>`);
}

/* ================= Palette Ctrl+K ================= */
const pal=document.getElementById('pal'), palIn=document.getElementById('palIn'), palList=document.getElementById('palList');
const palItems=()=>[
  ...Object.entries(pages).map(([k,p])=>({t:p.label,s:'Page',go:()=>{location.hash=k}})),
  ...members.map(m=>({t:m.name,s:'Membre',go:()=>openProfile(m.id)})),
  ...dungeons.map(d=>({t:d[0],s:`Donjon niv. ${d[1]}`,go:()=>openDungeon(d[0])})),
];
function drawPal(){const q=palIn.value.toLowerCase();const it=palItems().filter(i=>i.t.toLowerCase().includes(q)).slice(0,8);palList.innerHTML=it.map((i,n)=>`<li><a href="#" class="${n?'':'sel'}" data-n="${n}">${i.t}<small>${i.s}</small></a></li>`).join('');palList.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();closeAll();it[a.dataset.n].go()});palList._it=it}
function openPal(){closeAll();pal.classList.add('on');scrim.classList.add('on');palIn.value='';drawPal();setTimeout(()=>palIn.focus(),10)}
palIn.oninput=drawPal;
palIn.onkeydown=e=>{if(e.key==='Enter'&&palList._it[0]){closeAll();palList._it[0].go()}};
document.getElementById('openPal').onclick=openPal;
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}if(e.key==='Escape')closeAll()});

/* ================= Rendu ================= */
document.getElementById('meBtn').innerHTML=`${av(me,'sm')}<div><b>${me.name}</b><small>${me.role}</small></div>`;
document.getElementById('meBtn').onclick=()=>openProfile(me.id);
function render(){
  const key=(location.hash.slice(1)||'accueil'), p=pages[key]||pages.accueil, k=pages[key]?key:'accueil';
  document.getElementById('rail').innerHTML=`<div class="seal">${'<svg viewBox="0 0 46 30"><path fill="#fff" d="M12 29a10 10 0 0 1-1.5-19.9A12 12 0 0 1 33 7.5 9 9 0 0 1 36 29Z"/></svg>'}</div>`+
    Object.entries(pages).map(([id,pg])=>`<a href="#${id}" class="${id===k?'on':''}" ${id===k?'aria-current="page"':''}>${ico(pg.icon)}${pg.label}</a>`).join('')+'<div class="spacer"></div>';
  document.getElementById('ptitle').textContent=p.title;
  document.getElementById('view').innerHTML=p.render();
  p.after&&p.after();
}
addEventListener('hashchange',()=>{closeAll();render();scrollTo(0,0)});
render();
</script>
</body>
</html>
